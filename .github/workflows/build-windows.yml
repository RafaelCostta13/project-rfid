name: Build DSV RFID Windows

on:
  workflow_dispatch:

  push:
    branches:
      - feature/RF029-github-actions
    paths:
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: build-dsv-rfid-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and package
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure Python 3.12 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build-windows,dev]"
          python -m pip check

      - name: Run tests without hardware
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m pytest

      - name: Build Windows bundle
        run: python tools/build_windows.py

      - name: Verify Windows bundle
        run: python tools/verify_windows.py

      - name: Audit and package distribution
        shell: pwsh
        run: |
          $pyinstallerVersion = python -m PyInstaller --version
          python tools/package_windows.py --commit "${{ github.sha }}" --branch "${{ github.ref_name }}" --pyinstaller-version $pyinstallerVersion | Tee-Object -FilePath build/release/build-report.json
          Get-Content build/release/build-report.json | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload Windows distribution
        uses: actions/upload-artifact@ea165f8d65b7e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DSV-RFID-Windows
          path: |
            build/release/DSV-RFID-Windows-*.zip
            build/release/DSV-RFID-Windows-*.sha256
          if-no-files-found: error
          retention-days: 7
