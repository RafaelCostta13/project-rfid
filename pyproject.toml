[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rfid-reader"
version = "0.1.0"
description = "Base para comunicação com leitores RFID Zebra FX9600"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymodbus[serial]>=3.15,<3.16",
    "python-dotenv>=1.0,<2.0",
    "sllurp>=3.0.5,<4.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2.0",
    "pytest>=8.2,<9.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
rfid-reader = "rfid_reader.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/WAVESHARE/codigo-validado.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sllurp", "sllurp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hardware'"
markers = [
    "hardware: testes que exigem um reader RFID físico",
]
